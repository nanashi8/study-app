name: Deploy Firebase DB rules

# Realtime Database のセキュリティルール(database.rules.json)を Firebase に自動デプロイ。
# ルール関連ファイルを main に push したときだけ走る（手動実行も可）。
on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - firebase.json
      - .firebaserc
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install -g firebase-tools@15.27.0 --no-audit --no-fund

      # サービスアカウントJSON（GitHub Secrets: FIREBASE_SERVICE_ACCOUNT）を
      # 一時ファイルに書き出し、CLI の認証情報として使う。
      - name: Write service account
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Realtime Database rules
        run: firebase deploy --only database --project study-app-7165f --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      - name: Remove service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
