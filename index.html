<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="英検5級〜1級対応・スマホ最適の英語学習アプリ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>スタディアプリ</title>
    <script>
      // キャッシュ復旧：古い index.html が消えた旧JSを参照して真っ白になる事故を防ぐ。
      // 読み込み完了後しばらくしてもアプリが描画されていなければ、キャッシュされた
      // 古いHTMLを避けるためクエリを変えて取り直す（無限ループ防止に1セッション1回だけ）。
      (function () {
        var KEY = 'sa-recovered'
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.childElementCount > 0) {
              sessionStorage.removeItem(KEY)
              return
            }
            if (sessionStorage.getItem(KEY)) return // 既に1回リカバリ済み
            sessionStorage.setItem(KEY, '1')
            location.replace(location.pathname + '?r=' + Date.now() + location.hash)
          }, 3500)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
